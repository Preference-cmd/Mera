[package]
name = "reimagine-agent-adapter"
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
reimagine-app-host = { path = "../app-host", default-features = false }
reimagine-core = { path = "../core" }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
mod-sdk = { path = "../mod-sdk" }
# rmcp 3.8's client transport is generic over reqwest 0.13; the workspace's
# reqwest 0.12 cannot be passed to it.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
