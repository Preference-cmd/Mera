[package]
name = "mera-app-host"
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
jiff = { workspace = true }
ed25519-dalek = { workspace = true }
fs2 = { workspace = true }
hex = { workspace = true }
jsonschema = { workspace = true }
mod-sdk = { path = "../mod-sdk" }
mera-config = { path = "../config" }
mera-core = { path = "../core" }
mera-package-installer = { path = "../package-installer" }
reflink-copy = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
flate2 = { workspace = true }
mod-sdk = { path = "../mod-sdk", features = ["testing"] }
tar = { workspace = true }
tempfile = { workspace = true }
text-mod = { path = "../../mods/text" }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread"] }

[[bin]]
name = "app-host-mod-fixture"
path = "tests/fixtures/mod_fixture.rs"
