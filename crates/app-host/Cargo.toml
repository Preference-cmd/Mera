[package]
name = "mera-app-host"
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["aigc"]
aigc = ["dep:aigc"]

[dependencies]
aigc = { path = "../aigc", default-features = false, optional = true }
async-trait = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
jsonschema = { workspace = true }
mod-sdk = { path = "../mod-sdk" }
mera-backend-worker-host = { path = "../backend-worker-host" }
mera-backend-worker-protocol = { path = "../backend-worker-protocol" }
mera-config = { path = "../config" }
mera-core = { path = "../core" }
mera-inference = { path = "../inference" }
mera-model-acquisition = { path = "../model-acquisition" }
mera-model-manager = { path = "../model-manager" }
mera-nodes = { path = "../nodes" }
mera-package-installer = { path = "../package-installer" }
mera-runtime = { path = "../runtime" }
reflink-copy = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
flate2 = { workspace = true }
image = { workspace = true }
mod-sdk = { path = "../mod-sdk", features = ["testing"] }
safetensors = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
text-mod = { path = "../../mods/text" }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread"] }

[[bin]]
name = "app-host-mod-fixture"
path = "tests/fixtures/mod_fixture.rs"
