[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/core",
    "crates/config",
    "crates/mod-sdk",
    "crates/package-installer",
    "crates/app-host",
    "crates/agent-adapter",
    "mods/text",
]
exclude = ["crates/aigc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Preference"]
description = "Mera"
license = "GPL-3.0-or-later"
# A desktop application: no crate is published to a registry.
publish = false


[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = "1"
tokio-util = { version = "0.7", features = ["io", "rt"] }
sha2 = "0.10"
async-trait = "0.1"
axum = "0.8"
tracing = "0.1"
tempfile = "3"
ed25519-dalek = "2"
tar = "0.4"
flate2 = "1"
fs2 = "0.4"
jiff = { version = "1", features = ["serde"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# rmcp's client transport is generic over reqwest 0.13, while the shipped
# workspace pins 0.12. Adapter tests use this dev-only alias.
reqwest013 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
thiserror = "2"
jsonschema = { version = "0.60", default-features = false }
rmcp = { version = "3.10.0", default-features = false }
rand = "0.10"
reflink-copy = "0.1"
regex = "1"
unicode-normalization = "0.1"
ignore = "0.4"
trash = "5"
